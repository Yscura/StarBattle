<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26272b">
<title>Star Battle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* base reset */
*, *::before, *::after { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }

/* Layout: one-screen phone game. Header row, square board filling the width, control bar beneath. */
:root {
  color-scheme: dark;
  --bg: #26272b;
  --panel: #303136;
  --fg: #ecebe6;
  --muted: #9c9ca3;
  --line: #1c1c1f;
  --thin: rgba(28, 28, 31, .35);
  --star: #ffffff;
  --mark: #ffffff;
  --bad: #ff5d5d;
  --gold: #f2cf63;
  --flash: #fff6d8;
  /* difficulty tiers */
  --easy: #6fcf86;
  --medium: #f39a4c;
  --hard: #ff5d5d;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  /* region colors, muted like a printed puzzle book */
  --r0: #7f80cf; --r1: #8c6e5d; --r2: #8ea35b; --r3: #d8b75c; --r4: #d38c5d;
  --r5: #c46c7c; --r6: #7d9de0; --r7: #919aa6; --r8: #8c5ec2; --r9: #5fa79a;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--display);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.app {
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
h1 span { color: var(--gold); }
.timer { font-family: var(--mono); font-size: 1rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* level bar: arrows either side of the level picker button */
.levelbar { display: flex; gap: 8px; align-items: stretch; }
.arrow, .pick {
  font: inherit; color: var(--fg); background: var(--panel);
  border: 0; border-radius: 10px; cursor: pointer;
}
.arrow { width: 48px; font-size: 1.2rem; }
.arrow:disabled { opacity: .35; cursor: default; }
.pick {
  flex: 1; padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 1rem; font-weight: 500;
}
.pick small { font-size: .78rem; color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tag {
  font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tier); border: 1px solid currentColor; border-radius: 4px; padding: 1px 4px; margin-left: 6px;
  vertical-align: 2px;
}
.easy { --tier: var(--easy); }
.medium { --tier: var(--medium); }
.hard { --tier: var(--hard); }

/* level list sheet */
.sheet {
  position: fixed; inset: 0; z-index: 10;
  background: var(--bg);
  overflow-y: auto;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: fade .2s ease both;
}
.sheet-inner { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 24px; display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; background: var(--bg); padding-block: 4px; z-index: 1; }
.sheet-head h2 { margin: 0; font-size: 1.4rem; }
.sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
.close { font: inherit; font-size: 1rem; color: var(--fg); background: var(--panel); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.tile {
  font: inherit; color: var(--fg); background: var(--panel);
  border: 2px solid transparent; border-radius: 10px;
  padding: 10px 4px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  position: relative;
}
.tile b { font-size: 1.35rem; font-weight: 700; line-height: 1; }
.tile small { font-family: var(--mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.done small { color: var(--gold); }
.tile.current { border-color: var(--gold); }
.tile::after {
  content: ""; position: absolute; top: 7px; right: 7px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--tier);
}
.section { display: flex; flex-direction: column; gap: 10px; }
.section h3 {
  margin: 6px 0 0; font-size: 1rem; font-weight: 700; color: var(--tier);
  display: flex; align-items: baseline; gap: 8px;
}
.section h3 small { font-size: .78rem; font-weight: 500; color: var(--muted); font-family: var(--mono); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .8rem; }
.legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--tier); }
.legend .l-done::before { background: var(--gold); }
.legend .l-wip::before { background: var(--muted); }
.arrow:focus-visible, .pick:focus-visible, .tile:focus-visible, .close:focus-visible, .btn:focus-visible, .cell:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.board-wrap { position: relative; width: 100%; max-width: min(100%, 72vh); margin: 0 auto; }
.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  grid-template-columns: repeat(var(--n, 10), 1fr);
  grid-template-rows: repeat(var(--n, 10), 1fr);
  border-radius: 4px;
  overflow: hidden;
  touch-action: none; /* finger drags mark cells instead of scrolling */
}
.cell {
  position: relative;
  border: 0; padding: 0; margin: 0;
  background: var(--c);
  cursor: pointer;
  display: grid; place-items: center;
}
.cell svg { width: 70%; height: 70%; pointer-events: none; }
/* crosses stay light and thin so stars read as the solid, important marks */
.cell .x { width: 30%; height: 30%; filter: drop-shadow(0 0 1px rgba(0,0,0,.4)); }
.cell .x line { stroke: var(--mark); stroke-opacity: .8; stroke-width: 1.1; stroke-linecap: round; }
.cell .st { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); }
.cell .st path { fill: var(--star); stroke: rgba(0,0,0,.35); stroke-width: .8; stroke-linejoin: round; }
.cell.bad .st path { fill: var(--bad); }
.cell .pop { animation: pop .32s cubic-bezier(.3,1.6,.6,1) both; animation-delay: var(--d, 0ms); }
.cell .st.pop { animation-duration: .36s; }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
.cell { transition: filter .2s; }
.cell.dim { filter: brightness(.45) saturate(.6); }
.cell.target::after {
  content: ""; position: absolute; inset: 8%;
  border: 3px solid var(--gold); border-radius: 50%;
  animation: pulse 1.1s ease-in-out infinite alternate;
  pointer-events: none;
}
/* solve celebration: each cell flashes in turn, stars bounce as the wave passes */
.cell.flash::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: var(--flash);
  animation: flash .65s ease-out var(--fd, 0ms) both;
}
.cell.flash svg { position: relative; z-index: 1; }
.cell.flash .st { animation: starbounce .65s cubic-bezier(.3,1.6,.6,1) var(--fd, 0ms) both; }
@keyframes flash { 0% { opacity: 0; } 22% { opacity: .85; } 100% { opacity: 0; } }
@keyframes starbounce { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.35) rotate(12deg); } }
/* hint: stars a chain would force, shown faded */
.cell.ghost::before {
  content: "\2605"; position: absolute; inset: 0; display: grid; place-items: center;
  font-size: calc(min(100vw - 32px, 528px, 72vh) / var(--n, 10) * .62); line-height: 1;
  color: var(--gold); opacity: .75; pointer-events: none;
}
@keyframes pulse { from { transform: scale(.85); opacity: .6; } to { transform: scale(1); opacity: 1; } }
.grid-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.grid-lines .thin { stroke: var(--thin); stroke-width: 1; vector-effect: non-scaling-stroke; }
.grid-lines .thick { stroke: var(--line); stroke-width: 2; stroke-linecap: square; vector-effect: non-scaling-stroke; fill: none; }

.status { min-height: 2.8em; text-align: center; color: var(--muted); font-size: .95rem; line-height: 1.4; text-wrap: balance; }
.status b { color: var(--fg); font-weight: 500; }
.status.hint { color: var(--fg); }
.status.hint b { color: var(--gold); }
.btn.hint { color: var(--gold); }

.controls { display: flex; gap: 8px; }
.btn {
  flex: 1;
  font: inherit; font-size: .95rem; font-weight: 500;
  color: var(--fg);
  background: var(--panel);
  border: 0; border-radius: 10px;
  padding: 12px 8px;
  cursor: pointer;
}
.btn:disabled { opacity: .4; cursor: default; }
.btn.warn { background: #5a2f33; }
.btn.primary { background: var(--gold); color: #26272b; }

.win {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: rgba(20, 20, 23, .62);
  border-radius: 4px;
  animation: fade .4s ease both;
}
.win-card {
  background: var(--bg);
  border-radius: 14px;
  padding: 22px 24px;
  text-align: center;
  display: flex; flex-direction: column; gap: 10px;
  max-width: 80%;
}
.win-card h2 { margin: 0; font-size: 1.6rem; }
.win-card p { margin: 0; color: var(--muted); font-family: var(--mono); font-size: .9rem; }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  /* keep the wave's timing, but fade instead of scaling */
  .cell .pop { animation-name: appear; animation-timing-function: linear; }
  .cell.target::after { animation: none; }
  .cell.flash .st { animation: none; }
  .win { animation: none; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Star Battle <span>★</span></h1>
    <div class="timer" id="timer">00:00</div>
  </header>
  <nav class="levelbar" aria-label="Levels">
    <button class="arrow" id="prev" type="button" aria-label="Previous level">‹</button>
    <button class="pick" id="pick" type="button" aria-haspopup="dialog"></button>
    <button class="arrow" id="nextlvl" type="button" aria-label="Next level">›</button>
  </nav>
  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Puzzle board"></div>
    <div class="win" id="win" hidden>
      <div class="win-card">
        <h2 id="win-title">Solved</h2>
        <p id="win-time"></p>
        <button class="btn primary" id="next" type="button">Next level</button>
      </div>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="controls">
    <button class="btn" id="undo" type="button">Undo</button>
    <button class="btn hint" id="hint" type="button">Hint</button>
    <button class="btn" id="clear" type="button">Clear board</button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-inner">
    <div class="sheet-head">
      <div>
        <h2 id="sheet-title">Levels</h2>
        <p id="sheet-count"></p>
      </div>
      <button class="close" id="close" type="button">Close</button>
    </div>
    <div class="legend"><span class="easy">Easy</span><span class="medium">Medium</span><span class="hard">Hard</span><span class="l-done">Best time</span><span class="l-wip">In progress</span></div>
    <div id="grid"></div>
  </div>
</div>

  svg.innerHTML = `<path class="thin" d="${thin}"/><path class="thick" d="${thick}"/>`;
  return svg;
}

function render(animate) {
  const auto = computeAuto();
  const bad = conflicts();
  const placed = lastPlaced;
  for (let i = 0; i < N * N; i++) {
    const el = cellEls[i];
    const s = cells[i];
    const isAuto = s === BLANK && auto.has(i);
    const kind = s === STAR ? "star" : s === CROSS ? "cross" : isAuto ? "auto" : "blank";
    const wasKind = el.dataset.kind;
    el.classList.toggle("auto", kind === "auto");
    el.classList.toggle("bad", bad.has(i));
    el.classList.toggle("dim", !!hint && !hint.focus.has(i));
    el.classList.toggle("target", !!hint && hint.targets.has(i));
    el.classList.toggle("ghost", !!hint && hint.ghosts.has(i));
    el.setAttribute("aria-label", `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}: ${kind === "star" ? "star" : kind === "blank" ? "empty" : "crossed out"}`);
    if (wasKind === kind) continue;
    el.dataset.kind = kind;
    const crossLike = k => k === "cross" || k === "auto";
    if (kind === "star") el.innerHTML = STARSVG;
    else if (crossLike(kind)) { if (!crossLike(wasKind)) el.innerHTML = XSVG; }
    else el.innerHTML = "";
    const child = el.firstElementChild;
    if (!animate || !child || (crossLike(kind) && crossLike(wasKind))) continue;
    // Wave: delay grows with straight-line distance from the star that ruled the cell out
    let d = 0;
    if (kind === "auto") {
      const [r, c] = rc(i), [sr, sc] = rc(auto.get(i));
      d = Math.round(Math.hypot(r - sr, c - sc) * 85);
    }
    child.style.setProperty("--d", `${d}ms`);
    child.classList.add("pop");
  }
  const st = lvlState();
  const solvedNow = isSolved(bad);
  const stars = cells.filter(v => v === STAR).length;
  $("status").classList.toggle("hint", !!hint);
  $("status").innerHTML = hint ? hint.msg : bad.size
    ? `<b style="color:var(--bad)">Stars clash.</b> Two stars touch, or share a row, column or area.`
    : `<b>${stars}</b> of ${N * K} stars placed`;
  if (solvedNow && !st.solved) {
    stopTimer();
    st.solved = true;
    st.best = st.best == null ? st.time : Math.min(st.best, st.time);
    persist();
    setTimeout(showWin, animate ? celebrate(placed) : 0);
  }
  $("undo").disabled = !undoStack.length;
  renderLevels();
}

// Solve celebration: a flash rolls across the board from the last star placed.
// Returns how long it lasts (ms), so the "Solved" card can wait for it.
function celebrate(origin) {
  const [or, oc] = origin >= 0 ? rc(origin) : [(N - 1) / 2, (N - 1) / 2];
  const STEP = 70, FLASH = 650;
  let longest = 0;
  cellEls.forEach((el, i) => {
    const [r, c] = rc(i);
    const d = Math.round(Math.hypot(r - or, c - oc) * STEP);
    longest = Math.max(longest, d);
    el.style.setProperty("--fd", `${d}ms`);
    el.classList.remove("flash");
    void el.offsetWidth; // restart the animation if it ran before
    el.classList.add("flash");
  });
  setTimeout(() => cellEls.forEach(el => el.classList.remove("flash")), longest + FLASH + 100);
  return longest + FLASH + 250;
}

function tap(i) {
  if (lvlState().solved) return;
  const auto = computeAuto();
  const shown = cells[i] === BLANK && auto.has(i) ? CROSS : cells[i];
  // blank -> cross -> star -> blank. An auto-crossed cell already shows a cross, so it goes to star.
  const next = shown === BLANK ? CROSS : shown === CROSS ? STAR : BLANK;
  if (next === cells[i]) return;
  hint = null;
  undoStack.push([[i, cells[i]]]);
  cells[i] = next;
  lastPlaced = next === STAR ? i : -1;
  startTimer();
  save();
  render(true);
}

// ---------- drag to cross / clear ----------
// Dragging from a blank cell crosses every cell you pass over; dragging from a crossed
// cell clears crosses instead. Stars are never touched. A drag is one undo step.
let drag = null, dragEndAt = 0;
function cellAt(x, y) {
  const b = boardEl.getBoundingClientRect();
  const c = Math.floor((x - b.left) / b.width * N), r = Math.floor((y - b.top) / b.height * N);
  return r >= 0 && c >= 0 && r < N && c < N ? r * N + c : -1;
}
function dragApply(i) {
  if (i < 0 || drag.seen.has(i)) return;
  drag.seen.add(i);
  const want = drag.mode === "cross" ? CROSS : BLANK;
  const autoNow = computeAuto();
  if (cells[i] === STAR || cells[i] === want) return;
  if (want === CROSS && autoNow.has(i)) return; // already shows a cross
  drag.changes.push([i, cells[i]]);

}
function dragTo(i) {

  const steps = Math.max(Math.abs(r1 - r0), Math.abs(c1 - c0));
  for (let s = 1; s <= steps; s++)
    dragApply(Math.round(r0 + (r1 - r0) * s / steps) * N + Math.round(c0 + (c1 - c0) * s / steps));
  drag.last = i;
}
boardEl.addEventListener("pointerdown", e => {
  if (lvlState().solved || (e.pointerType === "mouse" && e.button !== 0)) return;
  const i = cellAt(e.clientX, e.clientY);
  if (i < 0) return;
  drag = { id: e.pointerId, start: i, last: i, moved: false, seen: new Set(), changes: [],
           mode: cells[i] === CROSS ? "clear" : "cross" };
});
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  const i = cellAt(e.clientX, e.clientY);
  if (i < 0 || i === drag.last) return;
  if (!drag.moved) { drag.moved = true; lastPlaced = -1; hint = null; dragApply(drag.start); }
  dragTo(i);
  render(true);
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.moved) {
    dragEndAt = performance.now();

    render(false);
  }
  drag = null;
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

// ---------- hints ----------
// Finds the next logical step from the current board. First tap points at where to look,
// second tap shows the exact cell(s) and why.
let hint = null, hintStep = null, SOLUTION = null;

function solve() { // the puzzle's single solution, as a set of cell indexes
  const col = new Array(N).fill(false), rg = new Array(N).fill(false), pick = [];
  function rec(r) {
    if (r === N) return true;
    for (let c = 0; c < N; c++) {
      const g = reg[r * N + c];
      if (col[c] || rg[g] || (r && Math.abs(pick[r - 1] - c) <= 1)) continue;
      col[c] = rg[g] = true; pick[r] = c;
      if (rec(r + 1)) return true;
      col[c] = rg[g] = false;
    }
    return false;
  }
  rec(0);
  return new Set(pick.map((c, r) => r * N + c));
}

// Names used in hint text. Areas are named after their colour (matches --r0 … --r9).
const AREA_COLOURS = ["lavender", "brown", "green", "yellow", "orange", "pink", "blue", "grey", "purple", "teal"];
const areaName = g => `the ${AREA_COLOURS[g]} area`;
const theUnit = u => u < 2 * N ? (u % 2 ? `column ${(u >> 1) + 1}` : `row ${(u >> 1) + 1}`) : areaName(u - 2 * N);
const cap = t => t[0].toUpperCase() + t.slice(1);

  const c = gs.map(g => AREA_COLOURS[g]);
  return c.length === 1 ? areaName(gs[0]) : `the ${c.slice(0, -1).join(", ")} and ${c[c.length - 1]} areas`;
}
function ruledOutBy(i) { // every cell a star at i rules out
  const out = new Set();
  const [r, c] = rc(i);
  for (let a = r - 1; a <= r + 1; a++) for (let b = c - 1; b <= c + 1; b++)
    if (a >= 0 && b >= 0 && a < N && b < N) out.add(a * N + b);

  out.delete(i);

}
function knowledge() { // 1 star, -1 crossed, 0 open
  const auto = computeAuto();
  return cells.map((v, i) => v === STAR ? 1 : v === CROSS || auto.has(i) ? -1 : 0);
}
// Fill in forced moves until stuck, recording each forced star in `trace` as { cell, unit }.
// Returns null if nothing breaks, else { unit } for a row/column/area left with no room,
// or { clash: [a, b] } for two stars that would rule each other out.
function propagate(g, trace = []) {
  for (let changed = true; changed;) {
    changed = false;
    for (let i = 0; i < N * N; i++) if (g[i] === 1)
      for (const j of ruledOutBy(i)) {
        if (g[j] === 1) return { clash: [i, j] };
        if (g[j] === 0) { g[j] = -1; changed = true; }
      }
    for (let u = 0; u < UNITS.length; u++) {
      const stars = UNITS[u].filter(i => g[i] === 1).length, open = UNITS[u].filter(i => g[i] === 0);
      if (stars === 0 && open.length === 0) return { unit: u };

}
// Sets of rows or columns to test: neighbouring bands, or spread-out picks like "columns 2 and 7"
function bands(kMin, kMax) {
  const out = [];

}

  const out = [];
  const pick = (k, from, acc, axis) => {
    if (acc.length === k) { if (acc[k - 1] - acc[0] !== k - 1) out.push({ axis, lines: acc.slice() }); return; }
    for (let x = from; x < N; x++) { acc.push(x); pick(k, x + 1, acc, axis); acc.pop(); }
  };

}
function describeLines(axis, lines) {
  const word = axis ? "column" : "row", n = lines.map(x => x + 1);
  if (n.length === 1) return `${word} ${n[0]}`;
  if (n[n.length - 1] - n[0] === n.length - 1) return `${word}s ${n[0]}–${n[n.length - 1]}`;
  return `${word}s ${n.slice(0, -1).join(", ")} and ${n[n.length - 1]}`;

// k rows (or columns) and the areas that fit inside them / feed them
function confinement(g, sets) {

    const line = i => axis ? i % N : Math.floor(i / N);

    const live = i => g[i] !== -1;

    for (let a = 0; a < N; a++) {
      const cellsA = [...Array(N * N).keys()].filter(i => reg[i] === a && live(i));
      if (cellsA.every(i => band.has(i))) inside.push(a);
      if (cellsA.some(i => band.has(i))) touching.add(a);
    }
    const what = describeLines(axis, lines);
    if (inside.length === k) {
      const targets = [...band].filter(i => !inside.includes(reg[i]) && g[i] === 0);
      if (targets.length) return {
        look: band,
        msg1: `Look at <b>${what}</b>. Is there an area that sits completely inside ${k === 1 ? "it" : "them"}?`,
        focus: new Set([...band, ...[...Array(N * N).keys()].filter(i => inside.includes(reg[i]))]), targets,
        msg2: `${cap(areaList(inside))} ${k === 1 ? "fits" : "fit"} entirely in <b>${what}</b>, so ${k === 1 ? "it takes the star" : "they take all the stars"} there. <b>Cross out</b> the marked cells.`,
      };
    }
    if (touching.size === k) {
      const gs = [...touching];
      const targets = [...Array(N * N).keys()].filter(i => touching.has(reg[i]) && !band.has(i) && g[i] === 0);
      if (targets.length) return {
        look: band,
        msg1: `Which areas can give <b>${what}</b> ${k === 1 ? "its star" : "their stars"}?`,
        focus: new Set([...band, ...[...Array(N * N).keys()].filter(i => touching.has(reg[i]))]), targets,
        msg2: `Only ${areaList(gs)} ${k === 1 ? "reaches" : "reach"} <b>${what}</b>, so ${k === 1 ? "its star has" : "their stars have"} to be there. <b>Cross out</b> the marked cells outside ${k === 1 ? "it" : "them"}.`,
      };
    }
  }
  return null;
}

function findStep() {
  // 1. mistakes first
  const wrong = [...Array(N * N).keys()].filter(i => (cells[i] === STAR && !SOLUTION.has(i)) || (cells[i] === CROSS && SOLUTION.has(i)));
  if (wrong.length) return {
    look: new Set(wrong.flatMap(i => [...UNITS[2 * N + reg[i]]])),
    msg1: `Something on the board is <b>wrong</b>. Check the highlighted area.`,
    targets: wrong, focus: new Set(wrong),
    msg2: `The marked ${wrong.length > 1 ? "cells are" : "cell is"} wrong. Undo or tap to change ${wrong.length > 1 ? "them" : "it"}.`,
  };
  const g = knowledge();
  // 2. a row, column or area with one open cell left
  for (let u = 0; u < UNITS.length; u++) {
    const open = UNITS[u].filter(i => g[i] === 0);
    if (open.length === 1 && !UNITS[u].some(i => g[i] === 1)) return {
      look: new Set(UNITS[u]),
      msg1: `Look closely at <b>${theUnit(u)}</b>.`,
      targets: open, focus: new Set(UNITS[u]),
      msg2: `Only one cell is left in ${theUnit(u)}. <b>Place a star</b> there.`,
    };
  }
  // 3. rows/columns vs. areas: one line first, then neighbouring bands of 2-4,
  //    then spread-out sets of 2-3 (e.g. "columns 2 and 7")
  const conf = confinement(g, bands(1, 1)) || confinement(g, bands(2, 4)) || confinement(g, spread(2, 3));
  if (conf) return conf;
  // 4. a cell that would wipe out a whole row, column or area by itself (the user finds this
  //    one the least natural, so it only comes after the counting steps)
  for (let i = 0; i < N * N; i++) {
    if (g[i] !== 0) continue;
    const gone = ruledOutBy(i);
    const u = UNITS.findIndex(un => !un.includes(i) && !un.some(j => g[j] === 1) && un.every(j => g[j] !== 0 || gone.has(j)));
    if (u >= 0) return {
      look: new Set(UNITS[u]),
      msg1: `${cap(theUnit(u))} is running out of room. Is there a cell that touches or lines up with all of its free cells?`,
      targets: [i], focus: new Set([...UNITS[u], i]),
      msg2: `A star here would cross out every free cell in ${theUnit(u)}. <b>Cross it out.</b>`,
    };
  }
  // 5. a star that sets off a chain of forced stars ending in a dead end. Use the shortest
  //    chain on the board and show it: the forced stars appear as faded stars.
  let best = null;
  for (let i = 0; i < N * N; i++) {
    if (g[i] !== 0) continue;
    const h = g.slice(); h[i] = 1;
    const trace = [];
    const end = propagate(h, trace);
    if (end && (!best || trace.length < best.trace.length)) best = { i, trace, end };
  }
  if (best) {
    const { i, trace, end } = best;
    const ghosts = trace.map(t => t.cell);
    const forced = trace.map(t => theUnit(t.unit));
    const chain = trace.length === 1
      ? `the faded star would be the only place left for the star in ${forced[0]}`
      : `stars would be forced into ${forced.slice(0, -1).join(", ")} and then ${forced[forced.length - 1]} (the faded stars)`;
    let look, broke, leads;
    if (end.clash) {
      const [a, b] = end.clash;
      const shared = UNITS.findIndex(un => un.includes(a) && un.includes(b));
      look = new Set(shared >= 0 ? UNITS[shared] : [a, b]);
      broke = shared >= 0 ? `${theUnit(shared)} would get two stars` : "two stars would touch";
      leads = shared >= 0 ? `puts two stars in <b>${theUnit(shared)}</b>` : "makes two stars touch";
    } else {
      look = new Set(UNITS[end.unit]);
      broke = `${theUnit(end.unit)} would have no room left`;
      leads = `leaves <b>${theUnit(end.unit)}</b> with no room`;
    }
    return {
      look,
      msg1: `A star in one cell would force other stars, in a chain that ${leads}. Which cell starts it?`,
      targets: [i], ghosts, focus: new Set([...look, i, ...ghosts]),
      msg2: `If the ringed cell had a star, ${chain}, and then ${broke}. So <b>cross out</b> the ringed cell.`,
    };
  }
  // fallback: reveal a star
  const i = [...SOLUTION].find(j => cells[j] !== STAR);
  return {
    look: new Set(UNITS[2 * N + reg[i]]),
    msg1: `This one needs a longer chain of reasoning. Focus on <b>${areaName(reg[i])}</b>.`,
    targets: [i], focus: new Set([i]),
    msg2: `<b>Place a star</b> here.`,
  };
}

$("hint").addEventListener("click", () => {
  const st = lvlState();
  if (st.solved || (hint && !hintStep)) return; // full hint already showing
  if (!hint) {
    hintStep = findStep();
    hint = { focus: hintStep.look, targets: new Set(), ghosts: new Set(), msg: hintStep.msg1 };
    st.hints = (st.hints || 0) + 1;
    persist();
  } else {
    hint = { focus: new Set([...hintStep.look, ...hintStep.focus]), targets: new Set(hintStep.targets), ghosts: new Set(hintStep.ghosts || []), msg: hintStep.msg2 };
    hintStep = null;
  }
  render(false);
});

// Tapping anywhere outside the board (and the Hint button) hides the hint, so you can
// scan the board again and see whether you'd have spotted the move yourself.
document.addEventListener("pointerdown", e => {
  if (!hint || boardEl.contains(e.target) || $("hint").contains(e.target)) return;
  hint = null; hintStep = null;
  render(false);
});

function save() {
  lvlState().cells = cells.slice();
  persist();
}

// ---------- timer ----------
let tick = 0, tickStart = 0, baseTime = 0;
function fmt(s) { const m = Math.floor(s / 60); return `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function startTimer() {
  if (tick || lvlState().solved) return;
  baseTime = lvlState().time; tickStart = Date.now();
  tick = setInterval(() => {
    lvlState().time = baseTime + Math.floor((Date.now() - tickStart) / 1000);
    $("timer").textContent = fmt(lvlState().time);
    persist();
  }, 1000);
}
function stopTimer() { clearInterval(tick); tick = 0; }
document.addEventListener("visibilitychange", () => { if (document.hidden) stopTimer(); });

// ---------- levels ----------
const started = st => !!st && !st.solved && (st.time > 0 || st.cells.some(v => v !== BLANK));
function renderLevels() {
  const solvedCount = LEVELS.filter((_, i) => stateOf(i)?.best != null).length;
  const st = stateOf(level);
  const L = LEVELS[level];
  $("pick").innerHTML = `<span>Level ${level + 1}<span class="tag ${L.tier}">${TIERS[L.tier]}</span></span>`
    + `<small>${st?.best != null ? `★ ${fmt(st.best)}` : `${solvedCount}/${LEVELS.length} ▾`}</small>`;
  $("prev").disabled = level === 0;
  $("nextlvl").disabled = level === LEVELS.length - 1;
}

function openSheet() {
  const grid = $("grid");
  const solvedCount = LEVELS.filter((_, i) => stateOf(i)?.best != null).length;
  $("sheet-count").textContent = `${solvedCount} of ${LEVELS.length} solved`;
  grid.innerHTML = "";
  const tiles = [];
  for (const tier of Object.keys(TIERS)) {
    const idx = LEVELS.map((L, i) => i).filter(i => LEVELS[i].tier === tier);
    if (!idx.length) continue;
    const sec = document.createElement("section");
    sec.className = `section ${tier}`;
    const size = LEVELS[idx[0]].regions.length;
    sec.innerHTML = `<h3>${TIERS[tier]}<small>${idx[0] + 1}–${idx[idx.length - 1] + 1} · ${size}×${size}</small></h3><div class="grid"></div>`;
    for (const i of idx) {
      const L = LEVELS[i], st = stateOf(i);
      const t = document.createElement("button");
      t.type = "button";
      t.className = `tile ${L.tier}` + (st?.best != null ? " done" : "") + (i === level ? " current" : "");
      const info = st?.best != null ? `★ ${fmt(st.best)}` : started(st) ? `${fmt(st.time)} …` : "—";
      t.innerHTML = `<b>${i + 1}</b><small>${info}</small>`;
      t.setAttribute("aria-label", `Level ${i + 1}, ${TIERS[L.tier]}: ${st?.best != null ? `best time ${fmt(st.best)}` : started(st) ? "in progress" : "not played"}`);
      t.addEventListener("click", () => { closeSheet(); openLevel(i); });
      sec.lastElementChild.appendChild(t);
      tiles[i] = t;
    }
    grid.appendChild(sec);
  }
  $("sheet").hidden = false;
  tiles[level]?.scrollIntoView({ block: "center" });
  tiles[level]?.focus({ preventScroll: true });
}
function closeSheet() { $("sheet").hidden = true; }
$("pick").addEventListener("click", openSheet);
$("close").addEventListener("click", () => { closeSheet(); $("pick").focus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("prev").addEventListener("click", () => level > 0 && openLevel(level - 1));
$("nextlvl").addEventListener("click", () => level < LEVELS.length - 1 && openLevel(level + 1));

function openLevel(i) {
  stopTimer();
  level = i;
  undoStack = []; lastPlaced = -1; hint = null; hintStep = null;
  disarmClear();
  buildBoard();
  SOLUTION = solve();
  const st = lvlState();
  cells = st.cells.slice();
  $("timer").textContent = fmt(st.time);
  $("win").hidden = !st.solved;
  if (st.solved) $("win-time").textContent = `Best time ${fmt(st.best)}`;
  updateNextBtn();
  persist();
  render(false);
}

function showWin() {
  stopTimer();
  const st = lvlState();
  const h = st.hints || 0;
  $("win-time").textContent = `Time ${fmt(st.time)} · best ${fmt(st.best)}` + (h ? ` · ${h} hint${h > 1 ? "s" : ""}` : "");
  updateNextBtn();
  $("win").hidden = false;
}
function updateNextBtn() {
  const last = level === LEVELS.length - 1;
  $("next").textContent = last ? "Play again" : "Next level";
}

$("next").addEventListener("click", () => {
  if (level < LEVELS.length - 1) openLevel(level + 1);
  else resetLevel();
});

$("undo").addEventListener("click", () => {
  const u = undoStack.pop();
  if (!u) return;
  for (let k = u.length - 1; k >= 0; k--) cells[u[k][0]] = u[k][1];
  hint = null;
  lastPlaced = -1;
  save();
  render(true);
});

function disarmClear() {
  clearArmed = false; clearTimeout(clearTimer);
  $("clear").textContent = "Clear board"; $("clear").classList.remove("warn");
}
$("clear").addEventListener("click", () => {
  if (!clearArmed) {
    clearArmed = true;
    $("clear").textContent = "Tap again to clear"; $("clear").classList.add("warn");
    clearTimer = setTimeout(disarmClear, 2500);
    return;
  }
  disarmClear();
  resetLevel();
});

function resetLevel() {
  stopTimer();
  const best = lvlState().best;
  saved.levels[LEVELS[level].id] = { cells: new Array(N * N).fill(BLANK), time: 0, solved: false, best };
  persist();
  openLevel(level);
}

openLevel(Math.min(level, LEVELS.length - 1));

// Offline support when installed from GitHub Pages
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
